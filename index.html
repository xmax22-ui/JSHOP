     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        .navbar {
            background-color: #333;
            overflow: hidden;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .nav-menu {
            list-style: none;
            display: flex;
        }

        .nav-menu li {
            margin-left: 20px;
        }

        .nav-menu a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            transition: background-color 0.3s;
        }

        .nav-menu a:hover {
            background-color: #555;
            border-radius: 4px;
        }

        /* Стили для кнопки аккаунта с выпадающим меню */
        .account-menu {
            position: relative;
            list-style: none;
        }

        .account-btn {
            color: white;
            background: none;
            border: none;
            padding: 15px 20px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .account-btn:hover {
            background-color: #555;
            border-radius: 4px;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: white;
            min-width: 150px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 4px;
        }

        .dropdown-menu a {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-menu a:hover {
            background-color: #f1f1f1;
        }

        .account-menu:hover .dropdown-menu {
            display: block;
        }

        .main-content {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 20px;
        }
    </style>

            <!-- Кнопка аккаунта с выпадающим меню -->

                    <button class="account-btn">Аккаунт ▼</button>
                    <div class="dropdown-menu">
                        <a href="#login">Войти</a>
                        <a href="#register">Создать аккаунт</a>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Основной контент страницы -->
    <div class="main-content">

    <script>
        // Упрощённая обработка кликов по пунктам меню аккаунта
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelector('#login').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Здесь будет форма входа');
            });

            document.querySelector('#register').addEventListener('click', function(e) {

        });
